<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideology</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #fff;
            color: #000;
        }

        /* ===== 黑色顶栏：品牌Logo + 主导航 ===== */
        .site-header {
            background-color: #000;
            padding: 18px 0 0;
        }

        .site-logo {
            text-align: center;
            color: #fff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 26px;
            font-style: italic;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .main-nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 28px;
            padding: 0 12px 14px;
        }

        .main-nav li {
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            color: #fff;
            transition: opacity 0.2s;
            position: relative;
            padding-bottom: 6px;
        }

        .main-nav li:hover {
            opacity: 0.65;
        }

        .main-nav li.active {
            font-weight: 500;
        }

        .main-nav li.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #fff;
        }

        /* ===== 栏目大标题（VOGUE: 64px, 上54 下40） ===== */
        .category-hero {
            text-align: center;
        }

        .category-hero h1 {
            font-size: 64px;
            font-weight: normal;
            margin: 0 auto;
            max-width: 1470px;
            padding: 54px 20px 40px;
        }

        /* 子导航（专题标题行，VOGUE h2: 32px 居中） */
        .sub-nav {
            text-align: center;
            padding: 0 20px;
            margin-bottom: 30px;
        }

        .sub-nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px 30px;
        }

        .sub-nav li {
            cursor: pointer;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 0.08px;
            color: #000;
            transition: opacity 0.2s;
        }

        .sub-nav li:hover {
            opacity: 0.55;
        }

        .sub-nav li.active {
            text-decoration: underline;
            text-underline-offset: 10px;
            text-decoration-thickness: 3px;
        }

        /* ===== 卡片区容器（VOGUE: max-width 1470, 左右45px） ===== */
        .card-section {
            max-width: 1470px;
            margin: 0 auto;
            padding: 0 45px;
        }

        /* 卡片区：row5，一行5张（VOGUE: 19%宽 上限280 列距1.25%） */
        .card-grid.row5 {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .card-grid.row5 .brand-card {
            width: 19%;
            max-width: 280px;
            margin-right: 1.25%;
            margin-bottom: 38px;
        }

        .card-grid.row5 .brand-card:nth-child(5n) {
            margin-right: 0;
        }

        /* ===== 卡片 ===== */
        .brand-card {
            cursor: pointer;
        }

        .brand-card .card-img {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            background-color: #efefef;
            background-size: cover;
            background-position: center;
            transition: opacity 0.25s;
            margin-bottom: 20px;
        }

        .brand-card:hover .card-img {
            opacity: 0.8;
        }

        .brand-card .card-name {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.08px;
            text-align: center;
            color: #000;
        }

        /* LATEST IN 标题（VOGUE h2: 32px） */
        .latest-title {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 0.08px;
            text-align: center;
            margin: 0 auto 30px;
            padding-top: 60px;
        }

        /* LATEST IN 分区：左侧品牌名录 + 右侧卡片 */
        .latest-flex {
            display: flex;
            align-items: flex-start;
            gap: 45px;
            max-width: 1470px;
            margin: 0 auto;
            padding: 0 45px;
        }

        .latest-flex .card-section {
            flex: 1;
            padding: 0;
            min-width: 0;
        }

        /* ===== 品牌名录 A-Z（VOGUE: 320px宽 #707070边框） ===== */
        .designer-directory {
            flex: none;
            width: 320px;
        }

        .directory-panel {
            display: flex;
            border: 1px solid #707070;
            background: #fff;
        }

        /* 左侧：品牌列表（VOGUE: 一次显示21行=21×34px，隐藏滚动条） */
        .directory-list {
            flex: 1;
            min-width: 0;
            height: 714px;
            overflow-y: auto;
            padding: 20px 10px 25px 35px;
            scrollbar-width: none;
        }

        .directory-list::-webkit-scrollbar {
            display: none;
        }

        .directory-letter {
            font-size: 28px;
            font-weight: 600;
            margin: 20px 0;
        }

        .directory-letter:first-child {
            margin-top: 0;
        }

        .directory-letter span {
            border-bottom: 4px solid #000;
            padding-bottom: 2px;
        }

        .directory-list ul {
            list-style: none;
        }

        .directory-list li {
            font-size: 14px;
            font-weight: 400;
            line-height: 34px;
            height: 34px;
            color: #000;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity 0.15s;
        }

        .directory-list li:hover {
            opacity: 0.55;
        }

        /* 右侧：A-Z 字母索引栏 */
        .directory-rail {
            flex: none;
            width: 34px;
            border-left: 1px solid #eee;
            padding: 14px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            height: 714px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .directory-rail button {
            border: none;
            background: none;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            padding: 2px 4px;
            line-height: 1.2;
            transition: all 0.15s;
        }

        .directory-rail button:hover {
            color: #000;
            font-weight: bold;
        }

        .directory-rail button.active {
            color: #000;
            font-weight: bold;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* 点选品牌后展示的单品牌卡片区 */
        .designer-view {
            max-width: 1470px;
            margin: 0 auto;
            padding: 30px 45px 0;
        }

        .designer-view .designer-name {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .designer-view .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 38px 1.25%;
        }

        .designer-view .brand-card {
            width: 19%;
            max-width: 280px;
        }

        /* 手机端适配（VOGUE 750px断点：边距20px） */
        @media (max-width: 768px) {
            .site-logo {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .main-nav ul {
                gap: 6px 16px;
            }

            .main-nav li {
                font-size: 12px;
            }

            .category-hero h1 {
                font-size: 32px;
                padding: 40px 16px 30px;
            }

            .sub-nav li {
                font-size: 16px;
            }

            .card-section {
                padding: 0 20px;
            }

            /* LATEST区：手机端一行2张（VOGUE: 48%） */
            .card-grid.row5 .brand-card {
                width: 48%;
                max-width: 320px;
                margin-right: 0;
                margin-bottom: 34px;
            }

            .brand-card .card-img {
                margin-bottom: 10px;
            }

            .brand-card .card-name {
                font-size: 15px;
            }

            .latest-title {
                font-size: 20px;
                padding-top: 45px;
            }

            /* LATEST IN：手机端名录在上方占满宽 */
            .latest-flex {
                flex-direction: column;
                gap: 24px;
                padding: 0 20px;
            }

            .designer-directory {
                width: 100%;
            }

            .directory-list {
                padding: 14px 10px 20px 20px;
                height: 588px; /* 手机端同样21行×28px */
            }

            .directory-letter {
                font-size: 16px;
                margin: 12px 0;
            }

            .directory-letter span {
                border-bottom-width: 3px;
            }

            .directory-list li {
                font-size: 12px;
                line-height: 28px;
                height: 28px;
            }

            .designer-view {
                padding: 25px 20px 0;
            }

            .designer-view .designer-name {
                font-size: 20px;
            }

            .designer-view .brand-card {
                width: 31.5%;
            }
        }
    </style>
</head>

        // 卡片图片路径：images/<栏目>/<子页名>/<卡片名>.png（可自行换成jpg）
        function cardImagePath(category, subpage, cardName) {
            return `images/${category}/${subpage}/${cardName}.png`;
        }

        // 创建卡片（图片加载失败时显示灰色占位块）
        function createCard(category, subpage, cardName) {
            const card = document.createElement('div');
            card.className = 'brand-card';

            const img = document.createElement('img');
            img.className = 'card-img';
            img.src = cardImagePath(category, subpage, cardName);
            img.alt = cardName;
            img.onerror = function() {
                const placeholder = document.createElement('div');
                placeholder.className = 'card-img';
                img.replaceWith(placeholder);
            };

            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = cardName;

            card.appendChild(img);
            card.appendChild(name);
            return card;
        }

        // 渲染一个栏目：大标题 + 子导航 + 精选卡区(3张) + LATEST IN(5张/行 + 名录)
        function renderCategory(category) {
            const data = SITE_DATA[category];
            const main = document.getElementById('site-main');
            main.innerHTML = '';

            // 栏目大标题
            const hero = document.createElement('div');
            hero.className = 'category-hero';
            hero.innerHTML = `<h1>${data.hero}</h1>`;
            main.appendChild(hero);

            // 子导航
            const subNav = document.createElement('nav');
            subNav.className = 'sub-nav';
            const ul = document.createElement('ul');
            data.subpages.forEach((sp, i) => {
                const li = document.createElement('li');
                li.textContent = sp.name;
                if (i === 0) li.classList.add('active');
                li.addEventListener('click', () => {
                    ul.querySelectorAll('li').forEach(x => x.classList.remove('active'));
                    li.classList.add('active');
                    renderCardGrid(category, sp);
                });
                ul.appendChild(li);
            });
            subNav.appendChild(ul);
            main.appendChild(subNav);

            // 精选卡片区（row3：一行3张）
            const gridSection = document.createElement('div');
            gridSection.className = 'card-section';
            const grid = document.createElement('div');
            grid.className = 'card-grid row5';
            grid.id = 'card-grid';
            gridSection.appendChild(grid);
            main.appendChild(gridSection);

            // LATEST IN 标题
            const latestTitle = document.createElement('div');
            latestTitle.className = 'latest-title';
            latestTitle.textContent = `LATEST IN ${data.hero.split(' ')[0]}`;
            main.appendChild(latestTitle);

            // LATEST IN：左侧品牌名录 + 右侧5张/行卡片
            const latestFlex = document.createElement('div');
            latestFlex.className = 'latest-flex';

            const latestSection = document.createElement('div');
            latestSection.className = 'card-section';
            latestSection.style.padding = '0';
            const latestGrid = document.createElement('div');
            latestGrid.className = 'card-grid row5';
            data.latestCards.forEach(cardName => {
                latestGrid.appendChild(createCard(category, 'latest', cardName));
            });
            latestSection.appendChild(latestGrid);
            latestFlex.appendChild(latestSection);
            main.appendChild(latestFlex);

            // 品牌名录（仅品牌栏目）
            if (data.designers && data.designers.length > 0) {
                renderDesignerDirectory(latestFlex, category, data.designers);
            }

            // 默认渲染第一个子页
            renderCardGrid(category, data.subpages[0]);
        }

        // 渲染某子页的精选卡片
        function renderCardGrid(category, subpage) {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            subpage.cards.forEach(cardName => {
                grid.appendChild(createCard(category, subpage.name, cardName));
            });
        }

        // 渲染品牌名录：左侧滚动列表（按字母分组）+ 右侧A-Z索引栏
        function renderDesignerDirectory(container, category, designers) {
            const section = document.createElement('div');
            section.className = 'designer-directory';

            const panel = document.createElement('div');
            panel.className = 'directory-panel';

            // 左侧列表：按首字母分组排序
            const list = document.createElement('div');
            list.className = 'directory-list';
            const groups = {};
            designers.forEach(name => {
                const letter = (name[0].toUpperCase() >= 'A' && name[0].toUpperCase() <= 'Z')
                    ? name[0].toUpperCase() : '#';
                if (!groups[letter]) groups[letter] = [];
                groups[letter].push(name);
            });
            const letters = Object.keys(groups).sort((a, b) => (a === '#' ? 1 : b === '#' ? -1 : a.localeCompare(b)));

            letters.forEach(letter => {
                const h = document.createElement('div');
                h.className = 'directory-letter';
                h.dataset.letter = letter;
                h.innerHTML = `<span>${letter}</span>`;
                list.appendChild(h);

                const ul = document.createElement('ul');
                groups[letter].sort((a, b) => a.localeCompare(b)).forEach(name => {
                    const li = document.createElement('li');
                    li.textContent = name;
                    li.addEventListener('click', () => showDesigner(category, name));
                    ul.appendChild(li);
                });
                list.appendChild(ul);
            });

            // 右侧字母索引
            const rail = document.createElement('div');
            rail.className = 'directory-rail';
            'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').forEach(letter => {
                const btn = document.createElement('button');
                btn.textContent = letter;
                btn.dataset.letter = letter;
                if (!letters.includes(letter)) {
                    btn.style.opacity = '0.25';
                    btn.style.cursor = 'default';
                } else {
                    btn.addEventListener('click', () => {
                        const target = list.querySelector(`[data-letter="${letter}"]`);
                        if (target) {
                            list.scrollTop = target.offsetTop - list.offsetTop - 10;
                            highlightRail(letter);
                        }
                    });
                }
                rail.appendChild(btn);
            });

            // 滚动时高亮当前字母
            list.addEventListener('scroll', () => {
                let current = letters[0];
                letters.forEach(letter => {
                    const h = list.querySelector(`[data-letter="${letter}"]`);
                    if (h && h.offsetTop - list.offsetTop <= list.scrollTop + 40) {
                        current = letter;
                    }
                });
                highlightRail(current);
            });

            panel.appendChild(list);
            panel.appendChild(rail);
            section.appendChild(panel);

            // 名录插到卡片左侧（LATEST IN 容器的第一个子元素）
            container.prepend(section);
        }

        // 高亮右侧索引中的字母
        function highlightRail(letter) {
            document.querySelectorAll('.directory-rail button').forEach(b => {
                b.classList.toggle('active', b.dataset.letter === letter);
            });
        }

        // 点选品牌：展示该品牌的卡片区（图片放 images/brand/designers/<品牌名>.png）
        function showDesigner(category, name) {
            const old = document.querySelector('.designer-view');
            if (old) old.remove();

            const view = document.createElement('div');
            view.className = 'designer-view';

            const nameEl = document.createElement('div');
            nameEl.className = 'designer-name';
            nameEl.textContent = name;
            view.appendChild(nameEl);

            const grid = document.createElement('div');
            grid.className = 'card-grid';
            grid.appendChild(createCard(category, 'designers', name));
            view.appendChild(grid);

            const latestFlex = document.querySelector('.latest-flex');
            if (latestFlex) {
                latestFlex.after(view);
            } else {
                document.getElementById('site-main').appendChild(view);
            }

            view.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 初始化：主导航切换 + 默认渲染
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.main-nav ul').addEventListener('click', function(e) {
                const clickedItem = e.target.closest('li');
                if (!clickedItem) return;

                document.querySelectorAll('.main-nav li').forEach(item => {
                    item.classList.remove('active');
                });
                clickedItem.classList.add('active');

                renderCategory(clickedItem.getAttribute('data-category'));
            });

            renderCategory('brand');
        });
    </script>
</body>
</html>
